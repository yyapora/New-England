<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashmetry Launcher</title>
</head>
<body style="background:#111;color:white;font-family:Arial;text-align:center;padding:40px">
<h2>Dashmetry</h2>
<button onclick="openGame()" style="padding:12px 24px;cursor:pointer">
Play Dashmetry
</button>

<script>
function openGame() {
  const tab = window.open("about:blank", "_blank");

  if (!tab) {
    alert("Allow pop-ups and try again.");
    return;
  }

  const frame = tab.document.createElement("iframe");
  frame.src = "https://challengerush.com/";
  frame.style.cssText =
    "position:fixed;inset:0;width:100%;height:100%;border:0";
  frame.allow = "autoplay; fullscreen";
  frame.allowFullscreen = true;

  tab.document.title = "Dashmetry";
  tab.document.body.style.margin = "0";
  tab.document.body.appendChild(frame);
}
</script>
</body>
</html>
